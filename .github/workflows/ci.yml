name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Tests, the schema check and the image build all live in the homelab.
  # A PR builds a pr- image, and the homelab gives it its own environment.
  subgraph:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: cujarrett/homelab/.github/workflows/subgraph.yml@main
    with:
      name: records
    secrets:
      APOLLO_KEY: ${{ secrets.APOLLO_KEY }}
